name: Pirate Observatory Client P0

on:
  push:
    branches:
      - feat/pirate-world-observatory-p0
    paths:
      - 'pirate-observatory/**'
      - 'tests/v90-pirate-observatory-p0.mjs'
      - 'tests/v90-pirate-observatory-stream-router.mjs'
      - 'tests/v90-pirate-observatory-rest-session.mjs'
      - 'tests/v90-pirate-observatory-runtime-context.mjs'
      - 'tests/v90-pirate-observatory-readiness.mjs'
      - 'tests/v90-pirate-observatory-status-transport.mjs'
      - 'tests/v90-pirate-observatory-websocket-session.mjs'
      - 'tests/v90-pirate-observatory-hybrid-session.mjs'
      - 'tests/v90-pirate-observatory-map-interest.mjs'
      - 'pirate-fruit-island-map-v900.mjs'
      - '.github/workflows/pirate-observatory-p0.yml'
  pull_request:
    paths:
      - 'pirate-observatory/**'
      - 'tests/v90-pirate-observatory-p0.mjs'
      - 'tests/v90-pirate-observatory-stream-router.mjs'
      - 'tests/v90-pirate-observatory-rest-session.mjs'
      - 'tests/v90-pirate-observatory-runtime-context.mjs'
      - 'tests/v90-pirate-observatory-readiness.mjs'
      - 'tests/v90-pirate-observatory-status-transport.mjs'
      - 'tests/v90-pirate-observatory-websocket-session.mjs'
      - 'tests/v90-pirate-observatory-hybrid-session.mjs'
      - 'tests/v90-pirate-observatory-map-interest.mjs'
      - 'pirate-fruit-island-map-v900.mjs'
      - '.github/workflows/pirate-observatory-p0.yml'

jobs:
  client-p0:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax checks
        run: |
          node --check pirate-observatory/protocol.mjs
          node --check pirate-observatory/partition-sync.mjs
          node --check pirate-observatory/transport.mjs
          node --check pirate-observatory/stream-router.mjs
          node --check pirate-observatory/connection-state.mjs
          node --check pirate-observatory/rest-session.mjs
          node --check pirate-observatory/runtime-context.mjs
          node --check pirate-observatory/websocket-session.mjs
          node --check pirate-observatory/hybrid-session.mjs
          node --check pirate-observatory/map-interest.mjs
          node --check pirate-observatory/interest-session.mjs
          node --check pirate-observatory/dashboard.mjs
          node --check pirate-observatory/bootstrap.mjs
      - name: Observatory client regression
        run: |
          node tests/v90-pirate-observatory-p0.mjs
          node tests/v90-pirate-observatory-stream-router.mjs
          node tests/v90-pirate-observatory-rest-session.mjs
          node tests/v90-pirate-observatory-runtime-context.mjs
          node tests/v90-pirate-observatory-readiness.mjs
          node tests/v90-pirate-observatory-status-transport.mjs
          node tests/v90-pirate-observatory-websocket-session.mjs
          node tests/v90-pirate-observatory-hybrid-session.mjs
          node tests/v90-pirate-observatory-map-interest.mjs
