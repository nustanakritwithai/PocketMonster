name: Deploy auth/profile staging preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: auth-profile-staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify client
        run: npm run ci
      - name: Generate protected test-project runtime config
        env:
          MONSTERLIFE_AUTH_PROFILE_PREVIEW: 'true'
          MONSTERLIFE_READONLY_ORIGIN: '${{ vars.MONSTERLIFE_AUTH_STAGING_ORIGIN }}'
          FIREBASE_TEST_API_KEY: '${{ vars.FIREBASE_TEST_API_KEY }}'
          FIREBASE_TEST_AUTH_DOMAIN: '${{ vars.FIREBASE_TEST_AUTH_DOMAIN }}'
          FIREBASE_TEST_PROJECT_ID: '${{ vars.FIREBASE_TEST_PROJECT_ID }}'
          FIREBASE_TEST_STORAGE_BUCKET: '${{ vars.FIREBASE_TEST_STORAGE_BUCKET }}'
          FIREBASE_TEST_MESSAGING_SENDER_ID: '${{ vars.FIREBASE_TEST_MESSAGING_SENDER_ID }}'
          FIREBASE_TEST_APP_ID: '${{ vars.FIREBASE_TEST_APP_ID }}'
        run: node scripts/write-deployment-runtime-config.mjs
      - name: Assert mutation flags remain disabled
        run: node tests/deployment-runtime-config.mjs
      - name: Deploy preview channel only
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_MONSTERLIFE_TEST }}'
          projectId: '${{ vars.FIREBASE_TEST_PROJECT_ID }}'
          channelId: auth-profile-staging
          expires: 7d
