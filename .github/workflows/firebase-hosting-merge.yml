name: Deploy PocketMonster to Firebase Hosting

on:
  workflow_call:
    inputs:
      release_sha:
        description: Exact GitHub Pages release commit
        required: true
        type: string
    secrets:
      FIREBASE_SERVICE_ACCOUNT_POCKETMONSTER_GAME:
        required: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ inputs.release_sha }}
      MONSTERLIFE_READONLY_ORIGIN: 'https://157.85.96.139'
      MONSTERLIFE_EXPECTED_API_BASE_URL: 'https://157.85.96.139'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify matching GitHub Pages release
        env:
          MONSTERLIFE_EXPECTED_SHA: '${{ env.RELEASE_SHA }}'
          MONSTERLIFE_DEPLOYMENT_BASE_URL: 'https://nustanakritwithai.github.io/PocketMonster/'
        run: node scripts/verify-live-v9-deployment.mjs pages

      - name: Generate read-only launcher configuration
        env:
          MONSTERLIFE_ASSET_BASE_URL: 'https://nustanakritwithai.github.io/PocketMonster/'
          MONSTERLIFE_FIREBASE_AUTH_BRIDGE: 'true'
          MONSTERLIFE_LAUNCH_TICKET: 'true'
          MONSTERLIFE_RELEASE_VERSION: '8.4.0-github.${{ env.RELEASE_SHA }}'
        shell: bash
        run: |
          test -n "$MONSTERLIFE_READONLY_ORIGIN"
          node scripts/write-deployment-runtime-config.mjs
          node tests/deployment-runtime-config.mjs
          node tests/production-launch-workflows.mjs
          node tests/v90-deployment-gates.mjs
          npm run test:remote-animation
          npm run test:v90:pirate-player
          node scripts/build-firebase-launcher.mjs
          node tests/hosting-architecture.mjs
          npm run test:v91:combat

      - name: Verify Monster Life backend before Firebase deployment
        env:
          MONSTERLIFE_EXPECTED_SHA: '${{ env.RELEASE_SHA }}'
        run: node scripts/verify-live-v9-deployment.mjs backend

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKETMONSTER_GAME }}'
          projectId: pocketmonster-game
          channelId: live

      - name: Verify deployed Firebase launcher
        env:
          MONSTERLIFE_EXPECTED_SHA: '${{ env.RELEASE_SHA }}'
          MONSTERLIFE_DEPLOYMENT_BASE_URL: 'https://pocketmonster-game.web.app/'
          MONSTERLIFE_EXPECTED_ASSET_BASE_URL: 'https://nustanakritwithai.github.io/PocketMonster/'
        run: node scripts/verify-live-v9-deployment.mjs firebase

      - name: Re-verify Pages release after Firebase deployment
        env:
          MONSTERLIFE_EXPECTED_SHA: '${{ env.RELEASE_SHA }}'
          MONSTERLIFE_DEPLOYMENT_BASE_URL: 'https://nustanakritwithai.github.io/PocketMonster/'
        run: node scripts/verify-live-v9-deployment.mjs pages
