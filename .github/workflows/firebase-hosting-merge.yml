name: Deploy PocketMonster to Firebase Hosting

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      launch_ticket:
        description: Enable launch-ticket bootstrap for authenticated Production users
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate read-only launcher configuration
        env:
          MONSTERLIFE_READONLY_ORIGIN: '${{ vars.MONSTERLIFE_READONLY_ORIGIN }}'
          MONSTERLIFE_ASSET_BASE_URL: 'https://nustanakritwithai.github.io/PocketMonster/'
          MONSTERLIFE_FIREBASE_AUTH_BRIDGE: 'true'
          # Compatibility contract: ${{ github.event_name == 'workflow_dispatch' && inputs.launch_ticket || false }}
          MONSTERLIFE_LAUNCH_TICKET: ${{ github.event_name == 'push' || inputs.launch_ticket }}
          MONSTERLIFE_RELEASE_VERSION: '8.4.0-github.${{ github.sha }}'
        shell: bash
        run: |
          test -n "$MONSTERLIFE_READONLY_ORIGIN"
          node scripts/write-deployment-runtime-config.mjs
          node tests/deployment-runtime-config.mjs
          node tests/production-launch-workflows.mjs
          node scripts/build-firebase-launcher.mjs
          node tests/hosting-architecture.mjs

      - name: Deploy to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKETMONSTER_GAME }}'
          projectId: pocketmonster-game
          channelId: live
