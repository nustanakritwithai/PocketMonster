name: Studio character live integration CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'asset-presentation/**'
      - 'game-v900.js'
      - 'boot-pirate-fruit-v900.mjs'
      - 'pirate-fruit-offline/pocket-presentation.mjs'
      - 'tests/v90-pirate-fruit-client-bridge.mjs'
      - 'tests/v91-studio-character-provider.mjs'
      - 'tests/v91-studio-character-live-wiring.mjs'
      - 'tests/v91-studio-blue-explorer-primary.mjs'
      - '.github/workflows/studio-character-provider-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check Studio runtime modules
        run: |
          node --check asset-presentation/studio-character-package.mjs
          node --check asset-presentation/providers/studio-character.mjs
          node --check asset-presentation/studio-character-live-bridge.mjs
          node --check game-v900.js
          node --check tests/v91-studio-character-provider.mjs
          node --check tests/v91-studio-character-live-wiring.mjs
          node --check tests/v91-studio-blue-explorer-primary.mjs
      - name: Run Studio character provider gate
        run: node tests/v91-studio-character-provider.mjs
      - name: Run Studio live wiring gate
        run: node tests/v91-studio-character-live-wiring.mjs
      - name: Run Blue Explorer primary rig and pivot gate
        run: node tests/v91-studio-blue-explorer-primary.mjs
      - name: Preserve Asset Engine contracts
        run: |
          node tests/v80-ae0-contracts.mjs
          node tests/v80-ae1-adapter.mjs
          node tests/v90-pirate-fruit-player.mjs
      - name: Run current Pocket release check
        run: npm run check
      - name: Run the complete hosting release gates before merge
        run: |
          node tests/deployment-runtime-config.mjs
          node tests/production-launch-workflows.mjs
          node tests/hosting-architecture.mjs
          node tests/v90-deployment-gates.mjs
          npm run test:v90:pirate-player
          npm run test:v91:combat
          npm run build:pages
