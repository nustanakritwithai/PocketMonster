name: World Simulator Ground CI

on:
  push:
    branches:
      - feat/world-simulator-map-adapter-v1
  pull_request:
    branches:
      - main
    paths:
      - 'world-simulator-map-adapter-v1.mjs'
      - 'world-simulator-ground-renderer-v1.mjs'
      - 'world-simulator-ground-live-v1.mjs'
      - 'world-living-v900.mjs'
      - 'runtime-config.mjs'
      - 'runtime-config.json'
      - 'assets/world-ground/**'
      - 'scripts/vendor-world-ground-polyhaven.mjs'
      - 'scripts/write-deployment-runtime-config.mjs'
      - 'tests/world-simulator-*.mjs'
      - 'tests/deployment-runtime-config.mjs'
      - 'tests/check-active-syntax.mjs'
      - 'tests/production-launch-workflows.mjs'
      - 'tests/v90-deployment-gates.mjs'
      - '.github/workflows/firebase-hosting-merge.yml'
      - '.github/workflows/world-simulator-ground-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  world-ground-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Adapter contract
        run: node tests/world-simulator-map-adapter-v1.mjs

      - name: Ground geometry and PBR presentation
        run: node tests/world-simulator-ground-renderer-v1.mjs

      - name: Live read-only wiring and fallback
        run: node tests/world-simulator-ground-live-v1.mjs

      - name: Firebase deployment ground flag
        run: node tests/deployment-runtime-config.mjs

      - name: Production launch workflow contract
        run: node tests/production-launch-workflows.mjs

      - name: V9 deployment gates
        run: node tests/v90-deployment-gates.mjs

      - name: Active syntax gate
        run: node tests/check-active-syntax.mjs
