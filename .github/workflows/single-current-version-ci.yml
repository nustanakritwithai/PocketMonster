name: Single current production version

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build-github-pages.mjs'
      - 'tests/v91-combat-artifact.mjs'
      - 'combined-worlds-v900.mjs'
      - 'boot-pirate-fruit-v900.mjs'
      - 'pirate-fruit-offline/**'
      - '.github/workflows/single-current-version-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  current-version-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build current production closure
        run: npm run build:pages
      - name: Verify unified current-world artifact
        run: node tests/v90-unified-pages-artifact.mjs
      - name: Verify current Pirate route
        run: |
          node -e "import('./combined-worlds-v900.mjs').then(({worldById})=>{const w=worldById('pirate-fruit'); if(w?.runtime!=='./boot-pirate-fruit-v900.mjs?v=953') throw new Error('Pirate Fruit current route changed: '+w?.runtime);})"
      - name: Reject alternate deployed entries
        run: |
          test ! -e dist-pages/v800.html
          test ! -e dist-pages/entry-preload.mjs
          test ! -e dist-pages/one-document-world-runtime-host-v910.mjs
          test ! -e dist-pages/world-runtime-lifecycle-v910.mjs
          test ! -e dist-pages/world-runtime-import-purity-v912.mjs
          test ! -e dist-pages/world-runtime-resource-scope-v912.mjs
          test ! -e dist-pages/world-pirate-native-v900.mjs
