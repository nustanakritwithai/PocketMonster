name: Deploy PocketMonster game assets to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pocketmonster-production-release
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      MONSTERLIFE_READONLY_ORIGIN: 'https://157.85.96.139'
      MONSTERLIFE_EXPECTED_API_BASE_URL: 'https://157.85.96.139'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate GitHub Pages runtime configuration
        env:
          MONSTERLIFE_ASSET_BASE_URL: 'https://nustanakritwithai.github.io/PocketMonster/'
          MONSTERLIFE_FIREBASE_AUTH_BRIDGE: 'true'
          MONSTERLIFE_LAUNCH_TICKET: 'true'
          MONSTERLIFE_RELEASE_VERSION: '8.4.0-github.${{ github.sha }}'
        run: node scripts/write-deployment-runtime-config.mjs
      - name: Verify Monster Life backend before Pages deployment
        env:
          MONSTERLIFE_EXPECTED_SHA: '${{ github.sha }}'
        run: node scripts/verify-live-v9-deployment.mjs backend
      - name: Verify hosting architecture
        run: |
          node tests/check-active-syntax.mjs
          node tests/deployment-runtime-config.mjs
          node tests/production-launch-workflows.mjs
          node tests/hosting-architecture.mjs
          node tests/v90-deployment-gates.mjs
          npm run test:v90:pirate-player
          npm run test:v91:combat
      - name: Build public game artifact
        run: npm run build:pages
      - name: Verify unified-world artifact
        run: node tests/v90-unified-pages-artifact.mjs
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed GitHub Pages release
        env:
          MONSTERLIFE_EXPECTED_SHA: '${{ github.sha }}'
          MONSTERLIFE_DEPLOYMENT_BASE_URL: '${{ steps.deployment.outputs.page_url }}'
        run: node scripts/verify-live-v9-deployment.mjs pages

  deploy-firebase:
    needs: deploy
    uses: ./.github/workflows/firebase-hosting-merge.yml
    with:
      release_sha: ${{ github.sha }}
    secrets: inherit
