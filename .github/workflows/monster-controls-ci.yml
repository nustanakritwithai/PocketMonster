name: Monster controls integration

on:
  pull_request:
    paths:
      - '*monster*control*.mjs'
      - 'monster-command-adapter.mjs'
      - 'monster-command-http-provider-v900.mjs'
      - 'monster-bag-state-provider-v900.mjs'
      - 'server-sync.mjs'
      - 'tests/pirate-canonical-party-controls.mjs'
      - 'tests/pirate-party-live-hp.mjs'
      - 'tests/v90-npc-online-recovery.mjs'
      - 'tests/monster-bag-state-provider.mjs'
      - 'game-v800.js'
      - 'character-ui-controller.mjs'
      - 'world-presence-v800.mjs'
      - 'unified-mmorpg-hud-v900.mjs'
      - 'unified-mobile-controls-v900.mjs'
      - 'online-world-shell-v900.mjs'
      - 'pirate-fruit-offline/**'
      - 'patch-manifest.json'
      - 'pirate-central-state-client.mjs'
      - 'pirate-save-bridge-v900.mjs'
      - 'tests/pirate-boat-selection-operation.mjs'
      - 'tests/*monster*control*.mjs'
      - 'tests/monster-command-adapter.mjs'
      - '.github/workflows/monster-controls-ci.yml'
      - 'tests/monster-authenticated-candidate.py'
      - 'tests/combat_browser_viewport.py'
      - 'tests/test_combat_browser_viewport.py'
  workflow_dispatch:
    inputs:
      authenticated_guest:
        description: 'ทดสอบ Guest จริงบน candidate ใน runner (ไม่ deploy)'
        type: boolean
        default: false
      production_live:
        description: 'ตรวจไฟล์ live จริงหลัง deploy (อนุญาต main เท่านั้น)'
        type: boolean
        default: false
      primary_recall_only:
        description: 'ตรวจปุ่มเดิม ปา→Recall→โจมตี พร้อม canonical readback'
        type: boolean
        default: false
      combat_timing:
        description: 'เก็บเวลารับ snapshot/เฟรมระหว่างต่อสู้ ไม่ใช่รับรองความลื่นมือถือ'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  authenticated-guest:
    if: github.event_name == 'workflow_dispatch' && inputs.authenticated_guest
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: monster-controls-client-candidate
          path: candidate-artifact
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: เตรียม browser เฉพาะ runner
        run: |
          pip install playwright==1.62.0
          python -m playwright install --with-deps chromium
      - name: ตรวจ Guest และฉากจาก candidate จริง
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          PRODUCTION_LIVE: ${{ inputs.production_live }}
          PRIMARY_RECALL_ONLY: ${{ inputs.primary_recall_only }}
          COMBAT_TIMING: ${{ inputs.combat_timing }}
        run: python tests/monster-authenticated-candidate.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: authenticated-candidate-evidence
          path: authenticated-candidate-evidence/
          retention-days: 3
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: สร้างแพตช์รวมบน runner
        run: |
          node scripts/build-github-pages.mjs --write-root-manifest
          node tests/v91-combat-artifact.mjs
      - name: ตรวจคำสั่งมอนสเตอร์
        run: |
          python3 tests/test_monster_combat_timing.py
          python3 tests/test_combat_browser_viewport.py
          node tests/monster-command-adapter.mjs
          node tests/monster-bag-state-provider.mjs
          node tests/pirate-monster-bag-vitals.mjs
      - name: ตรวจการเชื่อมแผงควบคุม
        run: |
          node tests/v90-monster-control-controller.mjs
          node tests/v90-monster-recall-races.mjs
          node tests/v90-monster-command-http-provider.mjs
          node tests/monster-control-realtime-refresh.mjs
          node tests/monster-controls-direct-runtime.mjs
          node tests/v90-unified-mmorpg-hud.mjs
          node tests/v90-unified-mobile-controls.mjs
          node tests/v90-unified-shell-runtime.mjs early-monster-scene
          node tests/pirate-monster-ui-only.mjs
          node tests/pirate-active-presence-prewarm.mjs
          node tests/pirate-prewarm-boot-order.mjs
          node tests/pirate-presence-aim-intents.mjs
          node tests/pirate-command-rejection-envelope.mjs
          node tests/v90-pirate-authority-animation-transport.mjs
          node tests/pirate-party-live-hp.mjs
          node tests/v90-npc-online-recovery.mjs
          node tests/pirate-canonical-party-controls.mjs
          node tests/pirate-monster-bag-window.mjs
          node tests/v90-pirate-paused-bag-preview.mjs
          node tests/v90-pirate-hud-scene-slots.mjs
          node tests/pirate-render-combat-presentation-guard.mjs
          node tests/v90-pirate-throw-failure-visible.mjs
          node tests/v90-unified-roster-stack.mjs
          node tests/v90-unified-hud-world-lifecycle.mjs
          node tests/v90-remote-monster-combat-parity.mjs
          node tests/v90-pirate-presence-readonly.mjs
      - name: ตรวจระบบ Client ที่เกี่ยวข้อง
        run: npm run check
      - name: ตรวจการบันทึกคำสั่ง Pirate เดิมผ่านระบบกลาง
        run: |
          node tests/pirate-central-state-client.mjs
          node tests/pirate-boat-selection-operation.mjs
          node tests/v90-pirate-save-bridge.mjs
      - name: ตรวจ artifact ทุกโลก
        run: node tests/v90-unified-pages-artifact.mjs
      - name: เก็บแพตช์สำหรับตรวจและติดตั้ง
        uses: actions/upload-artifact@v4
        with:
          name: monster-controls-client-candidate
          path: |
            patch-manifest.json
            dist-pages/
          if-no-files-found: error
          retention-days: 14
