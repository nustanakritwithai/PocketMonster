name: Minimap server presence

on:
  pull_request:
    paths:
      - 'server-minimap-presence-v900.mjs'
      - 'persistent-minimap-owner-v900.mjs'
      - 'entry-preload-v900.mjs'
      - 'tests/v90-minimap-server-presence.mjs'
      - 'tests/v90-unified-minimap.mjs'
      - 'tests/v90-unified-online-world.mjs'
      - '.github/workflows/minimap-server-presence-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax
        run: |
          node --check server-minimap-presence-v900.mjs
          node --check entry-preload-v900.mjs
      - name: Server-backed minimap presence
        run: node tests/v90-minimap-server-presence.mjs
      - name: Existing minimap regression
        run: node tests/v90-unified-minimap.mjs
      - name: Existing online-world regression
        run: node tests/v90-unified-online-world.mjs
