name: Studio real browser acceptance
on:
  pull_request:
    branches: [main]
    paths:
      - 'asset-presentation/**'
      - 'pirate-fruit-offline/pocket-presentation.mjs'
      - 'boot-pirate-fruit-v900.mjs'
      - 'tests/v91-studio-*.mjs'
      - 'tests/v91-studio-browser-acceptance.py'
      - '.github/workflows/studio-browser-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: studio-browser-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STUDIO_ENGINE_SHA: a71e6a3ca9919785bc06891cc954168c17a9d6bd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: nustanakritwithai/3JS-player-block-asset-engine-
          ref: a71e6a3ca9919785bc06891cc954168c17a9d6bd
          path: .ci-studio-source
      - name: Capture exact tracked sources for reproducible paired diagnosis
        run: |
          mkdir -p studio-source-evidence
          git rev-parse HEAD > studio-source-evidence/pocket-sha.txt
          git -C .ci-studio-source rev-parse HEAD > studio-source-evidence/engine-sha.txt
          git archive --format=tar.gz --output=studio-source-evidence/pocket-source.tar.gz HEAD
          git -C .ci-studio-source archive --format=tar.gz --output=../studio-source-evidence/engine-source.tar.gz HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: studio-source-evidence
          path: studio-source-evidence/
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated browser dependencies
        run: |
          pip install playwright==1.62.0 numpy pillow
          python -m playwright install --with-deps chromium
          npm install --prefix /tmp/studio-browser --no-package-lock --ignore-scripts three@0.169.0
          tar -czf studio-three-runtime.tar.gz -C /tmp/studio-browser/node_modules three
      - uses: actions/upload-artifact@v4
        with:
          name: studio-three-runtime
          path: studio-three-runtime.tar.gz
          retention-days: 7
      - name: Build exact Studio producer
        run: |
          python .ci-studio-source/scripts/generate_textures.py --output .ci-studio-source/assets/textures --resolution 2048
          python .ci-studio-source/scripts/build_pages.py
          cd .ci-studio-source && node scripts/test_pocket_studio_texture_export.mjs
      - name: State and material unit regressions
        run: |
          node tests/v91-studio-motion-completion.mjs
          node tests/v91-studio-character-render-profile.mjs
      - name: Real Studio to sandboxed Pirate browser acceptance
        run: python tests/v91-studio-browser-acceptance.py
      - name: Actual exported package through native vendor regression
        if: always()
        run: |
          node tests/v91-studio-real-vendor.mjs studio-browser-evidence/actual-studio-package.json
          node tests/v91-studio-motion-completion.mjs studio-browser-evidence/actual-studio-package.json studio-browser-evidence/motion-coverage.json
      - name: Preserve actual screenshots, video, exported package and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: studio-browser-evidence
          path: studio-browser-evidence/
          retention-days: 7
