name: Deploy Pirate Observatory staging preview

on:
  push:
    branches:
      - feat/pirate-world-observatory-p0
    paths:
      - 'pirate-observatory/**'
      - 'pirate-fruit-island-map-v900.mjs'
      - 'runtime-config.mjs'
      - 'runtime-config.json'
      - 'launch-bootstrap.mjs'
      - 'scripts/build-pirate-observatory-preview.mjs'
      - '.github/workflows/pirate-observatory-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify Observatory client
        run: |
          node --check scripts/build-pirate-observatory-preview.mjs
          node --check pirate-observatory/bootstrap.mjs
          node --check pirate-observatory/history-panel.mjs
          node --check pirate-observatory/history-map.mjs
          node tests/v90-pirate-observatory-evidence-playback.mjs
          node tests/v90-pirate-observatory-history-map.mjs

      - name: Generate read-only preview runtime config
        env:
          MONSTERLIFE_READONLY_ORIGIN: 'https://157.85.96.139'
          MONSTERLIFE_ASSET_BASE_URL: 'https://nustanakritwithai.github.io/PocketMonster/'
          MONSTERLIFE_FIREBASE_AUTH_BRIDGE: 'true'
          MONSTERLIFE_LAUNCH_TICKET: 'true'
          MONSTERLIFE_WORLD_SIM_GROUND: 'true'
          MONSTERLIFE_RELEASE_VERSION: '8.4.0-observatory.${{ github.sha }}'
        run: |
          node scripts/write-deployment-runtime-config.mjs
          node scripts/build-firebase-launcher.mjs
          node scripts/build-pirate-observatory-preview.mjs

      - name: Assert read-only preview config
        run: node tests/deployment-runtime-config.mjs

      - name: Verify Observatory preview artifact
        run: |
          test -f firebase-launcher/pirate-observatory/index.html
          test -f firebase-launcher/pirate-observatory/bootstrap.mjs
          test -f firebase-launcher/runtime-config.mjs
          test -f firebase-launcher/pirate-fruit-island-map-v900.mjs

      - name: Deploy Observatory preview channel
        id: deploy
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_POCKETMONSTER_GAME }}'
          projectId: pocketmonster-game
          channelId: pirate-observatory-test
          expires: 7d
