name: Vendor World Ground Textures Once

on:
  push:
    branches:
      - feat/world-simulator-ground-v2
    paths:
      - '.github/workflows/world-ground-vendor-once.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor:
    if: ${{ !contains(github.event.head_commit.message || '', '[ground-vendor]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/world-simulator-ground-v2
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vendor 1K CC0 PBR maps
        run: node scripts/vendor-world-ground-polyhaven.mjs --resolution=1k

      - name: Verify local material pack
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"installed": true' assets/world-ground/material-pack-v1.json
          count=$(find assets/world-ground/polyhaven -type f -name '*.jpg' | wc -l)
          test "$count" -ge 20
          if find assets/world-ground/polyhaven -type f -size +8M -print -quit | grep -q .; then
            echo 'Unexpected oversized 1K texture' >&2
            exit 1
          fi
          echo "Vendored JPEG maps: $count"

      - name: Commit vendored local textures
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/world-ground/material-pack-v1.json assets/world-ground/polyhaven
          if git diff --cached --quiet; then
            echo 'Material pack already vendored.'
            exit 0
          fi
          git commit -m '[ground-vendor] add Poly Haven CC0 1K PBR textures'
          git push origin HEAD:feat/world-simulator-ground-v2
